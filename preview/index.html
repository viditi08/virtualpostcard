<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whimsy Post</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,560;0,650;1,560&family=Plus+Jakarta+Sans:wght@420;520;650&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #FAF7F2;
      --panel: #FFFDF9;
      --ink: #2C1810;
      --muted: #6E5E57;
      --terra: #A34832;
      --terra-deep: #7d3424;
      --postal: #2B4C6F;
      --sage: #3D6B52;
      --gold: #C8963E;
      --envelope: #EFE6D8;
      --envelope-in: #E2D5C3;
      --line: #E5DBCB;
      --card: #FDFBF7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(200,150,62,.16), transparent 28%),
        radial-gradient(circle at 90% 0%, rgba(163,72,50,.08), transparent 24%),
        var(--paper);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; color: inherit; }
    .serif { font-family: Lora, Georgia, serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    header.bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 64px; padding: 0 20px;
      background: rgba(250,247,242,.88); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229,219,203,.8);
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
      background: var(--terra); color: white; box-shadow: 0 3px 0 var(--terra-deep);
    }
    .nav { display: flex; align-items: center; gap: 8px; }
    .btn {
      border: 0; cursor: pointer; border-radius: 999px; padding: 8px 14px;
      background: transparent; font-weight: 600;
    }
    .btn.solid { background: var(--terra); color: white; box-shadow: 0 3px 0 var(--terra-deep); }
    .btn.solid:active { transform: translateY(1px); box-shadow: 0 2px 0 var(--terra-deep); }
    .btn.ghost:hover { background: #F4E6D6; }
    .btn:disabled { opacity: .55; cursor: wait; }
    .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .hero { display: grid; grid-template-columns: 1fr; gap: 36px; padding: 48px 0 28px; align-items: center; }
    @media (min-width: 900px) { .hero { grid-template-columns: 1fr 1.05fr; padding-top: 72px; } }
    .eyebrow {
      display: inline-flex; gap: 8px; align-items: center;
      border: 1px solid rgba(163,72,50,.25); background: #FAF0E6;
      border-radius: 999px; padding: 4px 10px; letter-spacing: .18em;
      text-transform: uppercase; font-size: 11px; color: var(--terra);
    }
    h1 { font-size: clamp(42px, 6vw, 64px); line-height: 1.05; margin: 14px 0; letter-spacing: -.03em; }
    h1 em { color: var(--terra); font-style: italic; }
    .lede { font-size: 18px; line-height: 1.55; color: var(--muted); max-width: 440px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }
    .card-stage { display: grid; place-items: center; }
    .flip {
      width: min(100%, 560px); aspect-ratio: 1.5; perspective: 1400px; cursor: pointer;
    }
    .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.34,1.4,.64,1); }
    .flip.flipped .flip-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 3px; overflow: hidden; background: var(--card);
      backface-visibility: hidden; border: 7px solid var(--card);
      box-shadow: 0 18px 40px -12px rgba(44,24,16,.28);
    }
    .face.back {
      transform: rotateY(180deg); border-width: 0; padding: 5.5%;
      display: grid; grid-template-columns: 1.15fr 1px 1fr; gap: 4%;
      container-type: inline-size;
      background-color: #FDFBF7;
      background-image: radial-gradient(rgba(44,24,16,.045) .7px, transparent .8px);
      background-size: 9px 9px;
    }
    .face.back.portrait { display: flex; flex-direction: column; gap: 4%; padding: 7%; }
    .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .msg {
      margin: 0; min-height: 0; overflow: hidden;
      font-family: Lora, Georgia, serif; font-style: italic; font-size: 3.4cqw; line-height: 1.45;
      color: #243044; white-space: pre-wrap;
      background-image: repeating-linear-gradient(transparent, transparent calc(1.45em - 1px), rgba(214,206,191,.95) 1.45em);
    }
    .face.back.portrait .msg { font-size: 5cqw; flex: 1; }
    .rule { background: #D6CEBF; }
    .face.back.portrait .rule { display: none; }
    .letter-side { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; }
    .frank { position: relative; min-height: 48%; }
    .face.back.portrait .frank { display: flex; align-items: flex-start; justify-content: space-between; min-height: 0; }
    .postmark { position: absolute; left: -8%; top: 4%; width: 72%; color: rgba(43,76,111,.72); transform: rotate(-8deg); pointer-events: none; }
    .face.back.portrait .postmark { position: relative; left: 0; top: 0; width: 48%; }
    .postage { position: absolute; right: 0; top: 0; width: 38%; transform: rotate(3deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.22)); }
    .face.back.portrait .postage { position: relative; width: 26%; }
    .postage.picker { position: static; width: 100%; transform: none; }
    .stamp-perf {
      position: relative; aspect-ratio: 4/5; background: #FDFBF7;
      -webkit-mask-image: radial-gradient(circle 2.4px at 4px 4px, transparent 96%, #000 100%), linear-gradient(#000, #000);
      -webkit-mask-size: 8px 8px, calc(100% - 7px) calc(100% - 7px);
      -webkit-mask-position: -4px -4px, center;
      -webkit-mask-repeat: round, no-repeat;
      mask-image: radial-gradient(circle 2.4px at 4px 4px, transparent 96%, #000 100%), linear-gradient(#000, #000);
      mask-size: 8px 8px, calc(100% - 7px) calc(100% - 7px);
      mask-position: -4px -4px, center;
      mask-repeat: round, no-repeat;
    }
    .stamp-perf > svg { display: block; width: 100%; height: 100%; }
    .stamp-foil {
      position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 44%, rgba(255,214,150,.35) 50%, rgba(150,210,255,.3) 56%, transparent 68%);
      background-size: 250% 100%;
      animation: foil-sweep 7s ease-in-out infinite;
    }
    @keyframes foil-sweep { 0%, 72% { background-position: 160% 0; } 100% { background-position: -60% 0; } }
    .addr { display: flex; flex-direction: column; justify-content: flex-end; gap: .55em; font-size: 2.7cqw; }
    .face.back.portrait .addr { border-top: 1px solid #D6CEBF; padding-top: 4%; font-size: 4cqw; }
    .addr .when { margin: 0; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-size: .72em; }
    .addr div { display: flex; align-items: flex-end; gap: .4em; border-bottom: 1px dashed #D6CEBF; padding-bottom: .15em; }
    .addr .kicker { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .addr .hand { font-style: italic; font-size: 1.25em; line-height: 1; }
    section { padding: 28px 0 56px; }
    .steps { display: grid; gap: 14px; }
    @media (min-width: 800px) { .steps { grid-template-columns: repeat(3, 1fr); } }
    .step, .tile, .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
    }
    .marquee { display: flex; gap: 12px; overflow: hidden; }
    .marquee img { width: 180px; height: 120px; object-fit: cover; border-radius: 8px; border: 6px solid var(--card); }
    .faq details { border-bottom: 1px solid var(--line); padding: 12px 0; }
    .faq summary { cursor: pointer; font-weight: 650; }
    .auth {
      min-height: calc(100vh - 64px); display: grid;
    }
    @media (min-width: 900px) { .auth { grid-template-columns: 1fr 1fr; } }
    .auth aside {
      display: none; background: var(--ink); color: #FDFCFA; padding: 40px;
    }
    @media (min-width: 900px) { .auth aside { display: flex; flex-direction: column; justify-content: space-between; } }
    .auth main { display: grid; place-items: center; padding: 32px 16px; }
    form.desk { width: min(100%, 380px); display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    input, textarea, select {
      width: 100%; border: 1px solid #DCCFBC; background: white; border-radius: 12px; padding: 10px 12px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .error { color: #B91C1C; font-size: 14px; margin: 0; }
    .desk-grid { display: grid; gap: 16px; padding: 28px 0 60px; }
    @media (min-width: 800px) { .desk-grid.cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1100px) { .desk-grid.cards { grid-template-columns: repeat(3, 1fr); } }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { background: #F4E6D6; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
    .thumb { height: 180px; display: grid; place-items: center; background: #F3ECE1; border-radius: 12px; overflow: hidden; }
    .thumb img { width: 78%; height: 130px; object-fit: cover; border: 6px solid var(--card); }
    .badge { border-radius: 999px; padding: 3px 8px; font-size: 12px; color: white; }
    .editor { display: grid; gap: 22px; padding: 24px 0 70px; }
    @media (min-width: 980px) { .editor { grid-template-columns: 1.1fr .9fr; align-items: start; } }
    .designs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .designs button { padding: 0; border-radius: 10px; border: 2px solid transparent; background: none; cursor: pointer; overflow: hidden; }
    .designs button.selected { border-color: var(--ink); }
    .designs img { width: 100%; height: 72px; object-fit: cover; display: block; }
    .stamps { display: flex; flex-wrap: wrap; gap: 10px; }
    .stamps button { width: 86px; padding: 2px; border: 0; background: transparent; cursor: pointer; border-radius: 4px; }
    .stamps button.selected { outline: 2px solid var(--ink); outline-offset: 3px; }
    .seals { display: flex; gap: 8px; }
    .seals button { width: 28px; height: 28px; border-radius: 999px; border: 0; cursor: pointer; box-shadow: inset 0 -3px 5px rgba(0,0,0,.25); }
    .seals button.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
    .preview-sticky { position: sticky; top: 84px; }
    .share {
      position: fixed; inset: 0; background: rgba(44,24,16,.35); display: grid; place-items: center; padding: 16px; z-index: 30;
    }
    .share .panel { width: min(460px, 100%); }
    .linkbox { word-break: break-all; background: #F4E6D6; border-radius: 10px; padding: 10px; font-size: 14px; }
    .envelope-page { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 40px 16px 80px; }
    .envelope { width: min(92vw, 560px); aspect-ratio: 3/2; position: relative; cursor: pointer; }
    .env-back, .pocket, .flap { position: absolute; inset: 0; border-radius: 6px; }
    .env-back { background: var(--envelope-in); box-shadow: 0 24px 50px -14px rgba(44,24,16,.35); }
    .letter {
      position: absolute; left: 7%; right: 7%; top: 8%; bottom: 8%; z-index: 2;
      border: 6px solid var(--card); background: var(--card); overflow: hidden;
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
    }
    .letter img { width: 100%; height: 100%; object-fit: cover; }
    .letter.out { transform: translateY(-58%); }
    .pocket { background: var(--envelope); z-index: 3; clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
    .flap {
      background: #E7DCCB; z-index: 4; clip-path: polygon(0 0, 100% 0, 50% 62%);
      transform-origin: top center; transition: transform .7s ease;
    }
    .flap.open { transform: rotateX(180deg); }
    .wax {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: 74px; height: 74px; border-radius: 999px; z-index: 5;
      display: grid; place-items: center; color: white; font-family: Lora, Georgia, serif;
      box-shadow: inset 0 -6px 10px rgba(0,0,0,.25), 0 8px 16px rgba(44,24,16,.2);
    }
    .who { position: absolute; left: 8%; bottom: 12%; z-index: 4; }
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti i {
      position: absolute; top: -20px; width: 8px; height: 14px; animation: fall 1.4s ease-in forwards;
    }
    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: .2; } }
    .hidden { display: none !important; }
    .empty { text-align: center; padding: 48px 12px; color: var(--muted); }
  </style>
</head>

    const TOKEN_KEY = "whimsy_desk_token";
    const state = { user: null, designs: [], route: location.pathname };

    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const token = () => localStorage.getItem(TOKEN_KEY);
    const stampOf = (id) => STAMPS.find((stamp) => stamp.id === id) || STAMPS[0];
    let stampSeq = 0;

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (token()) headers.Authorization = `Bearer ${token()}`;
      if (options.json !== undefined) headers["Content-Type"] = "application/json";
      const response = await fetch(path, {
        method: options.method || "GET",
        headers,
        body: options.json !== undefined ? JSON.stringify(options.json) : options.body,
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error((data && data.detail) || "Something went wrong");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function go(path) {
      history.pushState({}, "", path);
      render();
    }

    function mailHref(link, recipientName, to, note) {
      const who = recipientName ? `, ${recipientName}` : "";
      const subject = "You've got mail";
      const local = /localhost|127\.0\.0\.1|0\.0\.0\.0/.test(link || "");
      const letter = (note || "").trim();
      const body = local
        ? `A little postcard for you${who}.\n\n${letter}\n`
        : `A little postcard for you${who}.\n\n${letter ? letter + "\n\n" : ""}Open the envelope here:\n${link}`;
      const address = (to || "").trim();
      return `mailto:${address}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function formatDate(iso) {
      const parsed = new Date(`${iso || ""}T12:00:00`);
      if (Number.isNaN(parsed.getTime())) return iso || "";
      return parsed.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    }

    function stampHtml(id, photoUrl, picker = false) {

    function bindAuth(mode) {
      const form = document.querySelector("form.desk");
      form.onsubmit = async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const error = form.querySelector(".error");
        error.classList.add("hidden");
        try {
          const result = await api(mode === "sign-up" ? "/api/auth/signup" : "/api/auth/login", { method: "POST", json: data });
          localStorage.setItem(TOKEN_KEY, result.token);
          state.user = { name: result.user.name, email: result.user.email, user_id: result.user.user_id };
          go("/app");
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove("hidden");
        }
      };
    }

      return `<div class="wrap">
        <div style="padding-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end">
          <div>
            <h1 class="serif" style="margin:0">Hello, ${esc((me.name || "friend").split(" ")[0])}.</h1>
            <div class="stats" style="margin-top:10px"><span class="stat">${cards.length} total</span><span class="stat">${sent} sent</span><span class="stat">${opened} opens</span></div>
          </div>
          <input id="search" placeholder="Search postcards" style="max-width:260px">
        </div>
        <div class="desk-grid cards" id="tiles">${tiles}</div>
      </div>`;
    }

    function bindDesk() {
      const search = document.getElementById("search");
      if (search) search.oninput = () => {
        const query = search.value.toLowerCase();
        document.querySelectorAll("#tiles article").forEach((tile) => {
          tile.classList.toggle("hidden", query && !tile.textContent.toLowerCase().includes(query));
        });
      };
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.onclick = async () => {
          const link = `${location.origin}/p/${button.dataset.copy}`;
          await navigator.clipboard.writeText(link);
          button.textContent = "Copied";
        };
      });
      document.querySelectorAll("[data-mail]").forEach((button) => {
        button.onclick = () => {
          window.location.href = mailHref(`${location.origin}/p/${button.dataset.mail}`, button.dataset.who || "");
        };
      });
      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.onclick = async () => {
          if (!confirm("Throw this postcard away?")) return;
          await api(`/api/postcards/${button.dataset.delete}`, { method: "DELETE" });
          render();
        };
      });
    }

    function blankCard(name) {
      return {
        title: "Untitled postcard",
        front_image_url: state.designs[0] ? state.designs[0].url : "/designs/balloons.jpeg",
        orientation: "landscape",
        size: "standard",
        message: "",
        recipient_name: "",
        sender_name: (name || "").split(" ")[0] || "",
        stamp_id: "vintage_airmail",
        seal_color: "#B83A28",
        is_draft: true,
      };
    }

    function editorHtml(form) {
      const designs = state.designs.map((design) => `<button type="button" data-design="${esc(design.url)}" data-orient="${esc(design.orientation)}" class="${form.front_image_url === design.url ? "selected" : ""}"><img src="${esc(design.url)}" alt="${esc(design.title)}"></button>`).join("");
      const stamps = STAMPS.map((stamp) => `<button type="button" data-stamp="${stamp.id}" class="${form.stamp_id === stamp.id ? "selected" : ""}" aria-label="${esc(stamp.name)}">${stampHtml(stamp.id, form.front_image_url, true)}</button>`).join("");
      const seals = SEALS.map((color) => `<button type="button" data-seal="${color}" class="${form.seal_color === color ? "selected" : ""}" style="background:${color}" aria-label="${color}"></button>`).join("");
      return `<div class="wrap editor">
        <form class="panel" id="editor" style="display:grid;gap:14px">
          <h1 class="serif" style="margin:0">${form.id ? "Edit postcard" : "New postcard"}</h1>
          <label>Title<input name="title" maxlength="120" value="${esc(form.title)}"></label>
          <div>
            <p style="font-weight:700;margin-bottom:8px">Front</p>
            <div class="designs">${designs}</div>
            <label style="margin-top:10px">Or upload a photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
          </div>
          <div class="row">
            <label>Format<select name="orientation"><option value="landscape" ${form.orientation === "landscape" ? "selected" : ""}>Landscape</option><option value="portrait" ${form.orientation === "portrait" ? "selected" : ""}>Portrait</option></select></label>
            <label>Size<select name="size"><option value="standard">Standard 6×4</option><option value="large" ${form.size === "large" ? "selected" : ""}>Large 7×5</option><option value="square" ${form.size === "square" ? "selected" : ""}>Square</option></select></label>
          </div>
          <label>To<input name="recipient_name" maxlength="80" value="${esc(form.recipient_name)}" placeholder="Grandma Rose"></label>
          <label>From<input name="sender_name" maxlength="80" value="${esc(form.sender_name)}"></label>
          <label>Message<textarea name="message" maxlength="600">${esc(form.message)}</textarea></label>
          <div><p style="font-weight:700">Stamp</p><div class="stamps">${stamps}</div></div>
          <div><p style="font-weight:700">Wax seal</p><div class="seals">${seals}</div></div>
          <p class="error hidden" role="alert"></p>
          <div class="row">
            <button class="btn ghost" type="submit" name="intent" value="draft">Save draft</button>
            <button class="btn solid" type="submit" name="intent" value="send">Seal & send</button>
          </div>
        </form>
        <div class="preview-sticky" id="live"></div>
      </div>`;
    }

    function readEditor(form, existing) {
      const data = Object.fromEntries(new FormData(form).entries());
      return {
        ...existing,
        title: data.title,
        orientation: data.orientation,
        size: data.size,
        message: data.message,
        recipient_name: data.recipient_name,
        sender_name: data.sender_name,
        front_image_url: existing.front_image_url,
        stamp_id: existing.stamp_id,
        seal_color: existing.seal_color,
      };
    }

    function bindEditor(existing) {
      const form = document.getElementById("editor");
      const live = document.getElementById("live");
      const draw = () => { live.innerHTML = cardHtml(existing) + `<p style="text-align:center;color:var(--muted)">Click the card to flip it.</p>`; };
      draw();
      form.oninput = () => { Object.assign(existing, readEditor(form, existing)); draw(); };
      form.querySelectorAll("[data-design]").forEach((button) => button.onclick = () => {
        existing.front_image_url = button.dataset.design;
        existing.orientation = button.dataset.orient;
        form.querySelector(`[name=orientation]`).value = existing.orientation;
        form.querySelectorAll("[data-design]").forEach((item) => item.classList.toggle("selected", item === button));
        draw();
      });
      form.querySelectorAll("[data-stamp]").forEach((button) => button.onclick = () => {
        existing.stamp_id = button.dataset.stamp;
        form.querySelectorAll("[data-stamp]").forEach((item) => item.classList.toggle("selected", item === button));
        draw();
      });
      form.querySelectorAll("[data-seal]").forEach((button) => button.onclick = () => {
        existing.seal_color = button.dataset.seal;
        form.querySelectorAll("[data-seal]").forEach((item) => item.classList.toggle("selected", item === button));
      });
      form.photo.onchange = async () => {
        const file = form.photo.files[0];
        if (!file) return;
        const body = new FormData();
        body.append("file", file);
        const result = await api("/api/uploads", { method: "POST", body });
        existing.front_image_url = result.url;
        form.querySelectorAll("[data-design]").forEach((item) => item.classList.remove("selected"));
        draw();
      };
      form.onsubmit = async (event) => {
        event.preventDefault();
        const intent = event.submitter?.value || "draft";
        const payload = { ...readEditor(form, existing), is_draft: intent !== "send" };
        const error = form.querySelector(".error");
        error.classList.add("hidden");
        try {
          const saved = existing.id
            ? await api(`/api/postcards/${existing.id}`, { method: "PUT", json: payload })
            : await api("/api/postcards", { method: "POST", json: payload });
          if (payload.is_draft) {
            go("/app");
            return;
          }
          const localLink = `${location.origin}/p/${saved.share_id}`;
          let publicLink = "";
          try {
            const info = await api(`/api/postcards/${saved.id}/anyone-link`);
            publicLink = info.url || "";
          } catch (err) {
            publicLink = "";
          }
          const link = publicLink || localLink;
          const note = publicLink
            ? "Anyone with this link can open the envelope, on their own phone or computer."
            : "This address only opens on this computer. A link for anyone else needs the public site address in PUBLIC_BASE_URL in backend/.env.";
          const dialog = document.createElement("div");
          dialog.className = "share";
          dialog.innerHTML = `<div class="panel"><h2 class="serif">Sealed and ready.</h2><p>${esc(note)}</p><p class="linkbox">${esc(link)}</p><label>Their email<input id="mail-to" type="email" placeholder="alex@example.com" autocomplete="email"></label><p id="mail-note" style="margin:0;color:var(--muted);font-size:14px">Send the email delivers the letter from Postcard Delivery. When a public link exists, that is the address in the email.</p><p class="error hidden" id="mail-error" role="alert"></p><div class="row"><button class="btn solid" id="email" type="button">Send the email</button><button class="btn ghost" id="mailto" type="button">Open my mail app</button><button class="btn ghost" id="copy" type="button">Copy link</button><a class="btn ghost" href="${esc(localLink)}" target="_blank">Preview</a><button class="btn ghost" id="done" type="button">Back to desk</button></div></div>`;
          document.body.appendChild(dialog);
          dialog.querySelector("#email").onclick = async () => {
            const input = dialog.querySelector("#mail-to");
            const to = input.value.trim();
            const mailError = dialog.querySelector("#mail-error");
            const button = dialog.querySelector("#email");
            if (!to.includes("@") || !to.includes(".") || to.includes(" ")) {
              mailError.textContent = "Enter a full email address, like alex@example.com.";
              mailError.classList.remove("hidden");
              return;
            }
            mailError.classList.add("hidden");
            button.disabled = true;
            button.textContent = "Sending…";
            try {
              const result = await api(`/api/postcards/${saved.id}/email`, { method: "POST", json: { to, link } });
              mailError.classList.add("hidden");
              button.textContent = `Sent to ${result.to}`;
            } catch (err) {
              mailError.textContent = err.message;
              mailError.classList.remove("hidden");
              button.disabled = false;
              button.textContent = "Send the email";
            }
          };
          dialog.querySelector("#mailto").onclick = () => {
            const to = dialog.querySelector("#mail-to").value.trim();
            window.location.href = mailHref(link, saved.recipient_name, to, saved.message);
          };
          dialog.querySelector("#copy").onclick = async () => { await navigator.clipboard.writeText(link); dialog.querySelector("#copy").textContent = "Copied"; };
          dialog.querySelector("#done").onclick = () => go("/app");
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove("hidden");
        }
      };
    }

    function cardFromHash() {
      const match = (location.hash || "").match(/^#card=([A-Za-z0-9_-]+)$/);
      if (!match) return null;
      try {
        const token = match[1];
        const json = atob(token.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((token.length + 3) % 4));
        const data = JSON.parse(json);
        const image = typeof data.front_image_url === "string" ? data.front_image_url : "";
        if (image && !image.startsWith("/designs/") && image !== "/hero-image.jpeg") return null;
        if (!data || typeof data !== "object") return null;
        return data;
      } catch (err) {
        return null;
      }
    }

    function recipientHtml(card) {
      return `<div class="envelope-page">
        <div>
          <p class="mono" style="text-align:center;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">A letter has arrived</p>
          <div class="envelope" id="envelope" data-testid="envelope">
            <div class="env-back"></div>
            <div class="letter" id="letter"><img src="${esc(card.front_image_url)}" alt=""></div>
            <div class="pocket"></div>
            <div class="flap" id="flap"></div>
            <div class="wax" id="wax" style="background:${esc(card.seal_color)}">W</div>
            <div class="who"><p class="mono" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">Special delivery for</p><p class="serif" style="font-size:32px;font-style:italic;margin:0" data-testid="envelope-recipient-name">${esc(card.recipient_name || "you")}</p></div>
          </div>
          <div id="opened" class="hidden" style="width:min(92vw,560px);margin-top:28px">${cardHtml(card)}</div>
        </div>
      </div>`;
    }

    async function pageRecipient(shareId) {
      let card;
      try {
        card = await api(`/api/public/postcards/${shareId}`);
      } catch (err) {
        return `<div class="empty"><h1 class="serif">This postcard could not be found.</h1><p>${esc(err.message)}</p><a class="btn solid" href="/">Make your own</a></div>`;
      }
      return recipientHtml(card);
    }

    function bindRecipient(shareId) {
      const envelope = document.getElementById("envelope");
      if (!envelope) return;
      let opened = false;
      envelope.onclick = async () => {
        if (opened) return;
        opened = true;
        if (!envelope.dataset.recorded) {
          envelope.dataset.recorded = "1";
          api(`/api/public/postcards/${shareId}/open`, { method: "POST", json: {} }).catch(() => {});
        }
        document.getElementById("flap").classList.add("open");
        document.getElementById("wax").classList.add("hidden");
        setTimeout(() => document.getElementById("letter").classList.add("out"), 500);
        setTimeout(() => {
          envelope.classList.add("hidden");
          document.getElementById("opened").classList.remove("hidden");
          const bits = document.createElement("div");
          bits.className = "confetti";
          for (let i = 0; i < 24; i += 1) {
            const piece = document.createElement("i");
            piece.style.left = `${Math.random() * 100}%`;
            piece.style.background = ["#A34832", "#2B4C6F", "#3D6B52", "#C8963E"][i % 4];
            piece.style.animationDelay = `${Math.random() * .3}s`;
            bits.appendChild(piece);
          }
          document.body.appendChild(bits);
        }, 1400);
      };
    }

    async function render() {
      const path = location.pathname;
      nav();
      const app = document.getElementById("app");
      const packed = cardFromHash();
      if (packed) {
        app.innerHTML = recipientHtml(packed);
        bindRecipient("packed");
        document.querySelectorAll("[data-flip]").forEach((node) => {
          node.onclick = () => node.classList.toggle("flipped");
        });
        return;
      }
      app.innerHTML = `<p class="empty">Loading Whimsy Post…</p>`;
      try {
        if (path === "/sign-in" || path === "/sign-up") {
          app.innerHTML = pageAuth(path === "/sign-in" ? "sign-in" : "sign-up");
          bindAuth(path === "/sign-in" ? "sign-in" : "sign-up");
        } else if (path === "/app") {
          if (!token()) return go("/sign-in");
          app.innerHTML = await pageDesk();
          bindDesk();
          nav();
        } else if (path === "/app/new" || path.startsWith("/app/edit/")) {
          if (!token()) return go("/sign-in");
          if (!state.designs.length) state.designs = await api("/api/designs");
          let existing = blankCard(state.user && state.user.name);
          if (path.startsWith("/app/edit/")) {
            existing = await api(`/api/postcards/${path.split("/").pop()}`);
          }
          app.innerHTML = editorHtml(existing);
          bindEditor(existing);
        } else if (path.startsWith("/p/")) {
          const shareId = path.split("/")[2];
          app.innerHTML = await pageRecipient(shareId);
          bindRecipient(shareId);
        } else {
          app.innerHTML = await pageHome();
        }
      } catch (err) {
        if (err.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          state.user = null;
          go("/sign-in");
          return;
        }
        app.innerHTML = `<div class="empty"><h1 class="serif">The studio hiccuped.</h1><p>${esc(err.message)}</p></div>`;
      }
      document.querySelectorAll("[data-flip]").forEach((node) => {
        node.onclick = () => node.classList.toggle("flipped");
      });
    }

    document.body.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (!link || link.target === "_blank" || link.origin !== location.origin) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      go(link.pathname);
    });
    window.addEventListener("popstate", render);

    (async () => {
      if (token()) {
        try { state.user = await api("/api/me"); } catch { localStorage.removeItem(TOKEN_KEY); }
      }
      render();
    })();
  </script>
</body>
</html>
